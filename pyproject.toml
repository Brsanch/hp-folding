[project]
name = "hp-folding"
version = "0.1.0"
description = "HP-lattice protein folding on the 2D square lattice."
authors = [{ name = "Bryan Sanchez" }]
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
proofs = [
    "ortools>=9.10",
    "highspy>=1.7",
    "pycosat>=0.6",
]
viz = [
    "matplotlib>=3.7",
    "numpy>=1.24",
]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
    "matplotlib>=3.7",
    "numpy>=1.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hp_folding"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "W", "UP"]
ignore = ["E501"]
